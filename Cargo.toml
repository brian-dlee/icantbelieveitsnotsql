[package]
name = "butter"
version = "0.2.0"
edition = "2021"
description = "Generate typed data-access code from plain SQL files, sqlc style."
license = "MIT"

[[bin]]
name = "butter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlparser = "0.59.0"
thiserror = "2.0.17"
toml = "0.9.8"
